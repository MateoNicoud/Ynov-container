apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik-to-wordpress
spec:
  podSelector:
    matchLabels:
      app: wordpress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik-to-acme-solver
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 8089
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wordpress-to-mariadb
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: mariadb-galera
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: wordpress
      ports:
        - port: 3306
---
# réplication Galera (3306, 4444 SST, 4567, 4568 IST, agent) entre les instances
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb-galera-cluster
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: mariadb-galera
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: mariadb-galera
---
# l'opérateur crée les comptes (3306) et pilote la reprise via l'agent Galera
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: operator-to-mariadb
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: mariadb-galera
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mariadb-operator
