apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb-galera
spec:
  rootPasswordSecretKeyRef:
    name: wordpress-db
    key: root-password
  database: wordpress
  username: wordpress
  passwordSecretKeyRef:
    name: wordpress-db
    key: password
  replicas: 3
  galera:
    enabled: true
  # une instance par nœud : le cluster garde le quorum (2/3) si un nœud tombe
  affinity:
    antiAffinityEnabled: true
  podDisruptionBudget:
    maxUnavailable: 1
  storage:
    size: 5Gi
    storageClassName: longhorn
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
