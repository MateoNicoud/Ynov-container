- name: Longhorn
  hosts: k8s_first
  become: true
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  tasks:
    - name: Longhorn (2 réplicas par défaut, disque dédié monté sur /var/lib/longhorn)
      kubernetes.core.helm:
        name: longhorn
        chart_ref: longhorn
        chart_repo_url: https://charts.longhorn.io
        chart_version: "{{ longhorn_version }}"
        release_namespace: longhorn-system
        create_namespace: true
        wait: true
        wait_timeout: 15m
        values:
          persistence:
            defaultClass: true
            defaultClassReplicaCount: 2
          defaultSettings:
            defaultDataPath: /var/lib/longhorn
            nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
            storageMinimalAvailablePercentage: 10
            rwxVolumeFastFailover: true

    - name: StorageClass 3 réplicas pour Postgres
      ansible.builtin.command: kubectl apply -f -
      args:
        stdin: |
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: {{ postgres_storage_class }}
          provisioner: driver.longhorn.io
          allowVolumeExpansion: true
          reclaimPolicy: Retain
          volumeBindingMode: Immediate
          parameters:
            numberOfReplicas: "3"
            staleReplicaTimeout: "30"
            fsType: ext4
      register: postgres_sc
      changed_when: "'unchanged' not in postgres_sc.stdout"
