# kubectl apply -k manifests/   (le namespace d'abord, puis le reste ; le ClusterIssuer est global)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - postgres.yaml
  - services.yaml
  - ingress.yaml
  - certificate.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicies.yaml
# Tag initial : la CI publie ghcr.io/<owner>/bark4me-<service>:<sha> et met ensuite à jour
# les Deployments. Fixer ici un SHA existant pour le premier apply.
images:
  - { name: ghcr.io/mateonicoud/bark4me-web, newTag: latest }
  - { name: ghcr.io/mateonicoud/bark4me-profiles, newTag: latest }
  - { name: ghcr.io/mateonicoud/bark4me-swipes, newTag: latest }
  - { name: ghcr.io/mateonicoud/bark4me-pedigree, newTag: latest }
  - { name: ghcr.io/mateonicoud/bark4me-photos, newTag: latest }
