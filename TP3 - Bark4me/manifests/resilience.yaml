# Patchs de résilience (référencés par kustomization.yaml) : réplicas répartis sur des nœuds différents
# et éviction rapide des pods d'un nœud arrêté.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: bark4me
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app: web }
      tolerations:
        # Éviction après 30 s sur un nœud perdu (300 s par défaut) : le site reprend vite après un arrêt brutal.
        - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
        - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
