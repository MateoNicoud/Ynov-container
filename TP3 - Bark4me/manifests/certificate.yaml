# Let's Encrypt en HTTP-01 via Traefik. Remplacer l'e-mail avant d'appliquer.
# Pour tester sans limite de débit : https://acme-staging-v02.api.letsencrypt.org/directory
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: mateo.nicoud@gmail.com
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bark4me-tls
  namespace: bark4me
spec:
  secretName: bark4me-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - bark4me-ynov.spaincentral.cloudapp.azure.com
