# Identifiants de la base : valeurs du TP (même couple que docker-compose). Un Secret réel
# serait créé hors dépôt ; ici le TP reste reproductible.
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: bark4me
type: Opaque
stringData:
  POSTGRES_USER: bark4me
  POSTGRES_PASSWORD: bark4me
  POSTGRES_DB: bark4me
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: bark4me
  labels: { app: postgres }
spec:
  clusterIP: None
  selector: { app: postgres }
  ports:
    - { name: pg, port: 5432, targetPort: pg }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: bark4me
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      serviceAccountName: bark4me
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - { name: pg, containerPort: 5432 }
          envFrom:
            - secretRef: { name: postgres }
          env:
            # Le volume Longhorn contient lost+found à sa racine : PGDATA dans un sous-dossier.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec:
              command: [sh, -c, "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [sh, -c, "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        # StorageClass Longhorn à 3 réplicas créée par la plateforme (postgres_storage_class).
        storageClassName: longhorn-postgres
        resources:
          requests: { storage: 5Gi }
