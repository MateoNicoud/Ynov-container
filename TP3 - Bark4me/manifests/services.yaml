apiVersion: apps/v1
kind: Deployment
metadata:
  name: profiles
  namespace: bark4me
  labels: { app: profiles }
spec:
  replicas: 2
  selector:
    matchLabels: { app: profiles }
  template:
    metadata:
      labels: { app: profiles }
    spec:
      serviceAccountName: bark4me
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: profiles
          image: ghcr.io/mateonicoud/bark4me-profiles:latest
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: PG_USER, valueFrom: { secretKeyRef: { name: postgres, key: POSTGRES_USER } } }
            - { name: PG_PASSWORD, valueFrom: { secretKeyRef: { name: postgres, key: POSTGRES_PASSWORD } } }
            - { name: PG_DB, valueFrom: { secretKeyRef: { name: postgres, key: POSTGRES_DB } } }
            - name: DATABASE_URL
              value: postgres://$(PG_USER):$(PG_PASSWORD)@postgres:5432/$(PG_DB)
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: profiles
  namespace: bark4me
  labels: { app: profiles }
spec:
  selector: { app: profiles }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
