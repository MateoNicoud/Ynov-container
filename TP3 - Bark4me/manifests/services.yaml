# Volume ReadWriteMany (Longhorn, via NFS share-manager) partagé par tous les réplicas de photos.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photos
  namespace: bark4me
spec:
  accessModes: [ReadWriteMany]
  storageClassName: longhorn
  resources:
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: photos
  namespace: bark4me
  labels: { app: photos }
spec:
  replicas: 2
  selector:
    matchLabels: { app: photos }
  template:
    metadata:
      labels: { app: photos }
    spec:
      serviceAccountName: bark4me
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Copie les photos livrées dans l'image vers le volume partagé (idempotent).
        - name: init
          image: ghcr.io/mateonicoud/bark4me-photos:latest
          args: ["init"]
          volumeMounts:
            - { name: photos, mountPath: /data }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      containers:
        - name: photos
          image: ghcr.io/mateonicoud/bark4me-photos:latest
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - { name: photos, mountPath: /data }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 25m, memory: 16Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: photos
          persistentVolumeClaim: { claimName: photos }
---
apiVersion: v1
kind: Service
metadata:
  name: photos
  namespace: bark4me
  labels: { app: photos }
spec:
  selector: { app: photos }
  ports:
    - { name: http, port: 8080, targetPort: http }
