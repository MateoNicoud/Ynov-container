# Pas de PDB sur postgres : une seule réplique, minAvailable: 1 bloquerait tout drain du nœud qui la porte.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: bark4me
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: web }
