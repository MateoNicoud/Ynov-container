# Passerelle locale : reproduit le routage par chemin de l'Ingress du cluster.
server {
  listen 80;
  resolver 127.0.0.11 valid=5s;
  location /api/profiles { set $u http://profiles:8080; proxy_pass $u; }
  location /photos/      { alias /usr/share/nginx/photos/; }  # remplacé par le service photos (ticket 05)
  location /             { set $u http://web:8080;      proxy_pass $u; }
}
