# Passerelle locale : reproduit le routage par chemin de l'Ingress du cluster.
server {
  listen 80;
  resolver 127.0.0.11 valid=5s;
  location /api/profiles { set $u http://profiles:8080; proxy_pass $u; }
  location /api/swipes   { set $u http://swipes:8080;   proxy_pass $u; }
  location /api/pedigree { set $u http://pedigree:8080; proxy_pass $u; }
  location /photos/      { set $u http://photos:8080;   proxy_pass $u; }
  location /             { set $u http://web:8080;      proxy_pass $u; }
}
