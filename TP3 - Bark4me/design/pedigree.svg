<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-labelledby="t d">
  <title id="t">Certificat de pédigrée validé</title>
  <desc id="d">Certificat BARK-XXXX pour NOM DU CHIEN, race, délivré par la Fédération canine imaginaire. Sans valeur légale.</desc>
  <!-- Zones remplies par le service pedigree : #nom, #race, #numero, #date -->
  <rect width="640" height="440" fill="#FBF3DF"/>
  <rect x="14" y="14" width="612" height="412" fill="none" stroke="#7A1E3A" stroke-width="4"/>
  <rect x="24" y="24" width="592" height="392" fill="none" stroke="#B08A2E" stroke-width="1.5"/>
  <g fill="#B08A2E">
    <circle cx="24" cy="24" r="6"/><circle cx="616" cy="24" r="6"/><circle cx="24" cy="416" r="6"/><circle cx="616" cy="416" r="6"/>
  </g>
  <g font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" text-anchor="middle" fill="#2B1B22">
    <text x="320" y="78" font-size="15" letter-spacing="4" fill="#7A1E3A">FÉDÉRATION CANINE IMAGINAIRE</text>
    <text x="320" y="124" font-size="36" font-weight="700">Pédigrée validé</text>
    <line x1="150" y1="142" x2="490" y2="142" stroke="#B08A2E" stroke-width="1.5"/>
    <text x="320" y="176" font-size="14" font-style="italic" fill="#5A4A3A">Il est certifié que le chien</text>
    <text id="nom" x="320" y="222" font-size="34" font-weight="700">NOM DU CHIEN</text>
    <text id="race" x="320" y="252" font-size="18" fill="#5A4A3A">Race</text>
    <text x="320" y="292" font-size="14" font-style="italic" fill="#5A4A3A">présente toutes les garanties de sérieux exigées d'un Profil.</text>
  </g>
  <g font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" fill="#2B1B22">
    <text x="60" y="372" font-size="12" fill="#5A4A3A">NUMÉRO</text>
    <text id="numero" x="60" y="398" font-size="26" font-weight="700" letter-spacing="2">BARK-XXXX</text>
    <text id="date" x="60" y="352" font-size="12" fill="#5A4A3A">JJ/MM/AAAA</text>
  </g>
  <text x="320" y="338" text-anchor="middle" font-family="system-ui,'Segoe UI',Roboto,Arial,sans-serif" font-size="11" fill="#5A4A3A">Document humoristique. Aucune valeur légale.</text>
