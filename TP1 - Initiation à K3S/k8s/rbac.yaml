apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: tp-finale
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api
  namespace: tp-finale
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [app-config]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api
  namespace: tp-finale
subjects:
  - kind: ServiceAccount
    name: api
    namespace: tp-finale
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api
