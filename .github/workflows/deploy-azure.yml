# TP 9 : promouvoir une image déjà publiée sur GHCR vers Azure, puis déployer sur AKS.
# Lancement manuel (onglet Actions > deploy-azure > Run workflow) avec le tag à déployer.
# Aucun mot de passe Azure dans GitHub : connexion OIDC (identité fédérée).
name: deploy-azure

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag GHCR à déployer (ex. sha-1a2b3c4 ou 1.2.0)"
        required: true

permissions:
  contents: read
  id-token: write   # autorise GitHub à émettre le jeton OIDC présenté à Azure
  packages: read    # lire l'image sur GHCR pour l'importer dans ACR

jobs:
  deploy:
    runs-on: ubuntu-latest
    # L'environnement "production" peut exiger une validation manuelle (Settings > Environments).
    # Le federated credential Azure est lié à cet environnement précis.
    environment: production
    env:
      SOURCE: ghcr.io/${{ github.repository_owner }}/tp-api:${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Promotion sans reconstruction : la même image (même digest) que celle testée et scannée en CI.
      - name: import GHCR -> ACR
        id: import
        run: |
          src=$(echo "$SOURCE" | tr '[:upper:]' '[:lower:]')
          az acr import --name "${{ vars.ACR_NAME }}" --source "$src" \
            --image "tp-api:${{ inputs.tag }}" \
            --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --force
          digest=$(az acr repository show --name "${{ vars.ACR_NAME }}" \
            --image "tp-api:${{ inputs.tag }}" --query digest -o tsv)
          echo "image=${{ vars.ACR_NAME }}.azurecr.io/tp-api@${digest}" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0

      - uses: azure/aks-set-context@883bdc8d8d1d0fd87e66cc4ba6f0b618f9eb5281 # v5.0.1
        with:
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_NAME }}

      # Les manifests du dépôt sont la source de vérité ; seule l'image change à chaque déploiement.
      # On remplace l'image avant d'appliquer (et pas après avec "kubectl set image") pour qu'un
      # seul rolling update ait lieu, directement vers la bonne image.
      # On déploie par digest : le tag pourrait être réassigné, le digest jamais.
      - name: deploy
        run: |
          kubectl kustomize k8s/azure \
            | sed "s|image: tp-api:dev|image: ${{ steps.import.outputs.image }}|" \
            | kubectl apply -f -
          kubectl -n wordpress rollout status deployment/api --timeout=5m
          kubectl -n wordpress rollout status deployment/wordpress --timeout=5m
