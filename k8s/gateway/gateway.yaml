# Gateway : le point d'entrée (une adresse, des ports). Envoy Gateway crée derrière
# un Deployment Envoy et un Service LoadBalancer dans envoy-gateway-system.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web
  annotations:
    # cert-manager voit cette annotation, crée un Certificate pour chaque listener HTTPS
    # et range la clé et le certificat dans le Secret nommé par certificateRefs.
    cert-manager.io/cluster-issuer: selfsigned
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same     # seules les routes du namespace wordpress peuvent s'y attacher
    - name: https-api
      protocol: HTTPS
      port: 443
      hostname: api.localhost      # cert-manager a besoin d'un hostname par listener
      tls:
        mode: Terminate            # TLS déchiffré par Envoy, HTTP simple vers les Pods
        certificateRefs:
          - name: api-tls
      allowedRoutes:
        namespaces:
          from: Same
---
# HTTPRoute : les règles de routage, posées par l'équipe applicative.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wordpress
spec:
  parentRefs:
    - name: web
  hostnames: [wordpress.localhost]
  rules:
    - backendRefs:
        - name: wordpress
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
spec:
  parentRefs:
    - name: web
  hostnames: [api.localhost]
  rules:
    - backendRefs:
        - name: api
          port: 80
