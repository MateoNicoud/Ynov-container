# Le driver CSI Secrets Store lit les secrets dans Key Vault et les monte en fichiers.
# Il s'authentifie avec l'identité managée (workload identity) liée au ServiceAccount du Pod.
# Une SecretProviderClass par application : chacune ne monte que son propre mot de passe.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: wordpress-db
spec:
  provider: azure
  parameters:
    clientID: IDENTITY_CLIENT_ID      # remplacé depuis params.env
    keyvaultName: KEYVAULT_NAME
    tenantId: TENANT_ID
    objects: |
      array:
        - |
          objectName: wordpress-password
          objectType: secret
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: api-db
spec:
  provider: azure
  parameters:
    clientID: IDENTITY_CLIENT_ID
    keyvaultName: KEYVAULT_NAME
    tenantId: TENANT_ID
    objects: |
      array:
        - |
          objectName: api-password
          objectType: secret
