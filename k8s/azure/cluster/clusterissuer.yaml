# Let's Encrypt : certificat gratuit, reconnu par les navigateurs, valable 90 jours,
# renouvelé automatiquement par cert-manager.
# Commencez par l'URL de staging : la production limite le nombre de certificats par semaine.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    # staging : https://acme-staging-v02.api.letsencrypt.org/directory
    server: https://acme-v02.api.letsencrypt.org/directory
    email: a-remplacer@example.com   # avertissements d'expiration
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: web
                namespace: wordpress
                kind: Gateway
