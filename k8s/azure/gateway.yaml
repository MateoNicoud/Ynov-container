# Une seule adresse publique, en HTTPS : WordPress sur /, l'API sur /api.
# /healthz, /readyz et /burn de l'API ne sont pas routés : ils restent internes au cluster.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  gatewayClassName: eg
  infrastructure:
    annotations:
      # Recopiée par Envoy Gateway sur le Service LoadBalancer : Azure donne alors
      # à l'IP publique le nom <DNS_LABEL>.<région>.cloudapp.azure.com.
      service.beta.kubernetes.io/azure-dns-label-name: DNS_LABEL
  listeners:
    - name: http                 # sert au challenge HTTP-01 de Let's Encrypt et à la redirection
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: PUBLIC_HOST
      tls:
        mode: Terminate
        certificateRefs:
          - name: web-tls
      allowedRoutes:
        namespaces:
          from: Same
---
# Tout ce qui arrive en HTTP est redirigé vers HTTPS (sauf le challenge ACME, géré par cert-manager).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-https
spec:
  parentRefs:
    - name: web
      sectionName: http
  hostnames: [PUBLIC_HOST]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
spec:
  parentRefs:
    - name: web
      sectionName: https
  hostnames: [PUBLIC_HOST]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/ }
      backendRefs:
        - name: api
          port: 80
    - backendRefs:
        - name: wordpress
          port: 80
