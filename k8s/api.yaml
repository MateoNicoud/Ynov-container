apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tp-finale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: api
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: tp-finale-api:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: db, key: DB_PASSWORD }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tp-finale
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http
