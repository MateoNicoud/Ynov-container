apiVersion: v1
kind: Namespace
metadata:
  name: wordpress
  labels:
    # Pod Security Admission (TP 7) : refuse les Pods qui ne respectent pas le profil baseline
    # (pas de privileged, pas de hostPath...) et prévient pour le profil restricted.
    # WordPress tourne en root (Apache sur le port 80), d'où baseline et pas restricted.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
