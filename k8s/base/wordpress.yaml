apiVersion: v1
kind: Service
metadata:
  name: wordpress
spec:
  selector:
    app: wordpress
  ports:
    - name: http
      port: 80
      targetPort: http
---
# wp-content contient les médias envoyés et les plugins : il doit survivre aux Pods.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wp-content
spec:
  accessModes: [ReadWriteOnce]   # un seul nœud peut monter le volume : d'où replicas: 1 plus bas
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
spec:
  replicas: 1
  # Recreate : l'ancien Pod libère le volume RWO avant que le nouveau démarre.
  # Avec RollingUpdate, le nouveau Pod resterait bloqué si le volume était sur un autre nœud.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wordpress
          image: wordpress:7.1
          ports:
            - name: http
              containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              valueFrom:
                configMapKeyRef: { name: wordpress-config, key: DB_HOST }
            - name: WORDPRESS_DB_NAME
              valueFrom:
                configMapKeyRef: { name: wordpress-config, key: DB_NAME }
            - name: WORDPRESS_DB_USER
              valueFrom:
                configMapKeyRef: { name: wordpress-config, key: DB_USER }
            # Le mot de passe est monté en fichier plutôt qu'en variable : il n'apparaît pas
            # dans "kubectl describe pod" ni dans l'environnement des processus.
            - name: WORDPRESS_DB_PASSWORD_FILE
              value: /run/secrets/db/wordpress-password
          volumeMounts:
            - name: wp-content
              mountPath: /var/www/html/wp-content
            - name: db-secret
              mountPath: /run/secrets/db
              readOnly: true
          securityContext:
            # Apache démarre en root pour écouter sur le port 80, puis passe en www-data.
            # On ne peut pas imposer runAsNonRoot sans reconstruire l'image : écart documenté.
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE, FOWNER, KILL]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet:
              path: /wp-login.php
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: wp-content
          persistentVolumeClaim:
            claimName: wp-content
        - name: db-secret
          secret:
            secretName: db
            items:
              - key: wordpress-password
                path: wordpress-password
