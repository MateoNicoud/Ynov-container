apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Identité propre à l'API, sans token monté : elle n'a rien à demander à l'API Kubernetes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # au plus 1 Pod en plus pendant la mise à jour
      maxUnavailable: 0    # jamais moins de Pods prêts que demandé : pas de coupure
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: api
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: tp-api:dev           # remplacé par overlay (minikube : image locale ; Azure : ACR)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef: { name: wordpress-config, key: DB_HOST }
            - name: DB_NAME
              valueFrom:
                configMapKeyRef: { name: wordpress-config, key: DB_NAME }
            - name: DB_USER
              value: api
            - name: DB_PASSWORD_FILE
              value: /run/secrets/db/api-password
          volumeMounts:
            - name: db-secret
              mountPath: /run/secrets/db
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 50m, memory: 32Mi }   # ce que le scheduler réserve ; base du calcul HPA
            limits: { cpu: 500m, memory: 64Mi }    # au-delà de 64Mi, le conteneur est tué (OOMKilled)
          # Liveness : le processus répond. Ne dépend pas de la base, sinon une panne de MariaDB
          # ferait redémarrer toutes les API en boucle sans rien réparer.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          # Readiness : la base répond. Sinon le Pod sort du Service mais n'est pas redémarré.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
      volumes:
        - name: db-secret
          secret:
            secretName: db
            items:
              - key: api-password
                path: api-password
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60   # 60 % des requests (50m), soit 30m par Pod en moyenne
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60   # 5 min par défaut ; raccourci pour le TP
