# Par défaut, plus aucun Pod du namespace ne reçoit de trafic. Chaque flux est ensuite autorisé
# explicitement. Nécessite un CNI qui applique les NetworkPolicy (Calico sur minikube).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# MariaDB n'accepte que WordPress et l'API, sur le port 3306.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb-from-apps
spec:
  podSelector:
    matchLabels:
      app: mariadb
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [wordpress, api] }
      ports:
        - port: 3306
---
# WordPress et l'API acceptent le trafic HTTP du contrôleur d'entrée (ingress-nginx ou Envoy Gateway).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-from-edge
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [wordpress, api] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [ingress-nginx, envoy-gateway-system]
      ports:
        - port: 80
        - port: 8080
