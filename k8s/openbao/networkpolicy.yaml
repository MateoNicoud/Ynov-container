# OpenBao doit joindre MariaDB pour créer et supprimer les comptes.
# Sans cette règle, default-deny-ingress bloque la connexion (TP 7).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb-from-openbao
spec:
  podSelector:
    matchLabels:
      app: mariadb
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbao
      ports:
        - port: 3306
